# The layout text of site

# ----- Commons label -----

layout:
  post: post
  category: category
  tag: tag

# The tabs of sidebar
tabs:
  # format: <filename_without_extension>: <value>
  home: home
  categories: categories
  tags: tags
  archives: archives
  about: about

# the text displayed in the search bar & search results
search:
  hint: search
  cancel: cancel
  no_results: oops! no results found.

panel:
  lastmod: recently updated
  trending_tags: trending tags
  toc: contents

copyright:
  # shown at the bottom of the post
  license:
    template: this post is licensed under :LICENSE_NAME by the author.
    name: cc by 4.0
    link: https://creativecommons.org/licenses/by/4.0/

  # displayed in the footer
  brief: some rights reserved.
  verbose: >-
    except where otherwise noted, the blog posts on this site are licensed
    under the creative commons attribution 4.0 international (cc by 4.0) license by the author.

# meta: Using the :THEME theme for :PLATFORM.
meta: other searches for midjourney include midjourner, midjourn, midgerny, midjournez, mid journey al, middlejourney ai, midhurney, midjarny, midjourn ey, midjourne y, midjourneyia, midjurni, mishourney, mitjurny, modjournet

not_found:
  statment: sorry, we've misplaced that url or it's pointing to something that doesn't exist.

notification:
  update_found: a new version of content is available.
  update: update

# ----- posts related labels -----

post:
  written_by: by
  posted: posted
  updated: updated
  words: words
  pageview_measure: views
  read_time:
    unit: min
    prompt: read
  relate_posts: further reading
  share: share
  button:
    next: newer
    previous: older
    copy_code:
      succeed: copied!
    share_link:
      title: copy link
      succeed: link copied successfully!

# Date time format.
# See: <http://strftime.net/>, <https://day.js.org/docs/en/display/format>
df:
  post:
    strftime: "%b %e, %Y"
    dayjs: "ll"
  archives:
    strftime: "%b"
    dayjs: "MMM"

# categories page
categories:
  category_measure:
    singular: category
    plural: categories
  post_measure:
    singular: post
    plural: posts
